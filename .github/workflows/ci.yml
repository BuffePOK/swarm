name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    # The server is Linux: only Linux results gate the image. Windows and macOS are reported, not blocking,
    # until they have been checked once by hand.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      # --locked: fail if uv.lock does not match pyproject; every wheel is hash-checked.
      - run: uv sync --locked --extra dev
      - run: uv run python scripts/check_supply_chain.py
      - run: uv run pytest

  # Only on main and only after every test job is green. The server pulls the new :latest by itself
  # (podman auto-update, every 2 minutes): no SSH keys or deploy secrets live in GitHub.
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: roj:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name roj-ci roj:ci serve --no-panel --interval 2
          for i in $(seq 1 30); do docker exec roj-ci roj healthcheck && break; sleep 1; done
          docker exec roj-ci roj healthcheck || { docker logs roj-ci; exit 1; }
          docker exec roj-ci roj doctor | head -3
          docker exec roj-ci git --version
          docker exec roj-ci roj selftest
          docker rm -f roj-ci
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
