[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "roj"
version = "0.5.1"
description = "Multi-agent system with a stateless leader, teams, hard gates, budgets and an auditable kernel."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Dmytro Dychenko" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
# Core stays small on purpose (ADR-0001): at most 5 runtime dependencies.
dependencies = [
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "tzdata>=2024.1",  # IANA time zones for Windows and minimal containers that have no system zoneinfo
]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=1.0"]
browser = ["playwright>=1.45"]
rag = ["bm25s>=0.2", "lancedb>=0.10"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
desktop = ["pywinauto>=0.6; sys_platform == 'win32'"]

[project.scripts]
roj = "roj.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["roj"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
